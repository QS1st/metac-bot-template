name: Test Bot

on:
  workflow_dispatch:

# Add concurrency group to prevent parallel runs
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false


# Manual smoke test against the bot-testing-area tournament (7 questions, one
# of each type, never scored). Also the rig for cost probes: set the MODEL_TIER
# repository variable to "season" to measure what frontier models really cost
# per question, then delete the variable to go back to the cheap tier.
jobs:
  forecast_job:
    runs-on: ubuntu-latest # determines the machine that will run the job - keep as is
    # A season-tier probe is slower than the test tier: five predictions per
    # question instead of one. Twenty minutes is ample and stops a hung run
    # holding the concurrency group for GitHub's six-hour default.
    timeout-minutes: 20
    steps: # sets up the steps that will be run in order
      # setup repository with all necessary dependencies - keep as is
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Pinned 25 Sept 2026 to what the live runs already use (run 1834's log:
      # this action SHA, Poetry 2.5.1), so the happy path is unchanged:
      #   * the action by commit, not the floating @v1 tag;
      #   * Poetry 2.5.1, not "latest" (2.5.0 shipped 19 Sept, 2.5.1 on the
      #     20th; a new Poetry release can no longer land mid-season unseen).
      # NOT a full freeze: the installer still takes the newest pip and the
      # newest of Poetry's own dependencies, and checkout/setup-python float.
      # poetry.lock was generated by 2.4.1 (lock-version 2.1); 2.5.1 is what
      # every live run has installed since PyPI made it "latest" on 20 Sept.
      # Move all five workflows together, and only between seasons.
      - name: Install poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1, pinned
        with:
          version: "2.5.1"
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      # Adding the below will make the workflow faster, but will mean you don't automatically get updates from forecasting-tools and other packages
      # - name: Load cached venv
      #   id: cached-poetry-dependencies
      #   uses: actions/cache@v4
      #   with:
      #     path: .venv
      #     key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Run bot
        run: |
          poetry run python main.py --mode test_questions
        # this reads the environment variables from the github repository.
        # Store under Settings --> Secrets and variables --> Actions
        env:
          # Repository VARIABLES (not secrets), and not visible to the process
          # unless passed through here — an unset variable renders as an empty
          # string, which main.py treats as "use the default".
          #
          # TEST_MODEL_TIER, not MODEL_TIER, and that distinction matters.
          # Both workflows originally read the same variable, so setting it to
          # "season" for a cost probe here would ALSO have put the 10-minute
          # scheduled tournament workflow on frontier models — about $0.50 a
          # question, six batches to empty the account. Found by audit before
          # the tournament workflow was ever enabled. A probe must not be able
          # to reconfigure the live bot.
          MODEL_TIER: ${{ vars.TEST_MODEL_TIER }}
          AIB_TOURNAMENT_ID: ${{ vars.AIB_TOURNAMENT_ID }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }} # replace this with the name of the variable under which you stored your own Metaculus token
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
