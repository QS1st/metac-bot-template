name: Tests

# WHY THIS EXISTS
#
# Until 31 August 2026 the unit tests lived in the repository but nothing ever
# ran them. They were run by hand, on a copy, before upload — which is exactly
# the "verified against a convenient copy rather than the real thing" mistake
# this project keeps making.
#
# An audit that day found a test asserting the WRONG behaviour (that a corrupt
# numeric distribution should be repaired into a confident wrong answer rather
# than discarded) and a multiple-choice floor that renormalisation silently
# undid. Tests only help if something runs them.
#
# This runs on every push and every pull request. No API keys, no network,
# no credentials — it lifts the pure functions out of main.py and exercises
# them, so it is fast and cannot touch a live question.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: main.py must at least parse
        run: python -m py_compile main.py

      - name: Unit tests
        run: python test_phase1.py

      - name: The patch must still apply cleanly to upstream
        # patch_phase1.py asserts each edit matches exactly once, so this fails
        # loudly if the upstream template moves under us rather than silently
        # producing a different bot.
        run: |
          git clone --depth 1 https://github.com/Metaculus/metac-bot-template.git /tmp/upstream
          python patch_phase1.py /tmp/upstream/main.py /tmp/rebuilt.py
          python -m py_compile /tmp/rebuilt.py

      - name: The committed main.py must match what the patch produces
        # Guards against hand-edits to main.py that never made it back into
        # patch_phase1.py — which would make the build unreproducible and the
        # disclosure document wrong.
        run: |
          if ! diff -q main.py /tmp/rebuilt.py; then
            echo "::error::main.py does not match the output of patch_phase1.py"
            diff main.py /tmp/rebuilt.py | head -40
            exit 1
          fi
          echo "main.py is reproducible from the patch."

      # AST STRUCTURE. py_compile proves main.py parses; it says nothing about
      # its SHAPE. On 21 September 2026 a patch edit anchored on a line INSIDE
      # the `if __name__ == "__main__":` suite, and inserting a column-zero def
      # above it ended the suite — leaving everything from argparse to EOF as
      # unreachable code in a helper's body. The bot would have started,
      # configured logging and exited 0: a green tick every ten minutes for four
      # months and not one forecast. It parsed, it matched the patch, and 255
      # unit tests passed over it. test_phase1.py now checks this too; it is
      # repeated here because this is the job that cannot be skipped.
      - name: The __main__ block must still be the end of the file
        run: |
          python - <<'EOF'
          import ast, pathlib, sys
          src = pathlib.Path("main.py").read_text()
          tree = ast.parse(src)
          guards = [n for n in tree.body
                    if isinstance(n, ast.If) and "__main__" in ast.dump(n.test)]
          if len(guards) != 1:
              sys.exit(f"::error::expected one __main__ guard, found {len(guards)}")
          guard = guards[0]
          if tree.body[-1] is not guard:
              sys.exit("::error::something is defined AFTER the __main__ guard")
          if guard.end_lineno != len(src.splitlines()):
              sys.exit(
                  f"::error::the __main__ block ends at line {guard.end_lineno} "
                  f"of {len(src.splitlines())} - its body has been truncated"
              )
          print(f"__main__ runs to line {guard.end_lineno}, the end of the file.")
          EOF

  # THE ONE CHECK THE UNIT TESTS CANNOT DO. Everything above runs without the
  # dependencies, deliberately — it is fast and cannot touch a live question.
  # But that means nothing verifies that main.py can actually be IMPORTED: that
  # every name it pulls from forecasting_tools still exists in the pinned
  # version, and that bot_helpers.py still exports what it is asked for. An
  # import error surfaces only when a scheduled run dies, which is the worst
  # possible place to find out. No secrets, no network calls to Metaculus, no
  # model spend — MODEL_TIER defaults to "test" and the __main__ block does not
  # run on import. Added 21 September 2026.
  import-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Show the resolved forecasting-tools version
        run: poetry run python -c "import importlib.metadata as m; print('forecasting-tools', m.version('forecasting-tools'))"
      - name: main.py must import
        run: poetry run python -c "import main; print('main.py imported cleanly')"

      # THE LIBRARY BEHAVIOURS OUR PROMPTS ARE ARGUED FROM. Several edits rest on
      # exactly how forecasting-tools validates a parsed forecast — that a binary
      # value of 1 is silently coerced to 0.999 rather than rejected (which is how
      # a 1% belief could reach 98%), and that a multiple-choice option carries
      # `option_name` on `predicted_options` (which is what the option guard
      # reads). Those were verified by hand against 0.2.92 on 21-22 Sept 2026.
      # Nothing re-checked them, and the bot runs unattended for four months
      # across whatever the resolver picks next. This does.
      - name: The library still behaves the way the prompts assume
        run: |
          poetry run python - <<'EOF'
          import sys
          from forecasting_tools import BinaryPrediction, PredictedOptionList

          # Exactly 1 must COERCE to 0.999, not raise. This is the behaviour that
          # let a 1% belief reach 98%: the validator quietly accepts 1, and our
          # caps then clamp it. If it ever starts raising instead, the binary
          # parser's bullets about bare numbers can be relaxed.
          v = BinaryPrediction(prediction_in_decimal=1).prediction_in_decimal
          if v != 0.999:
              sys.exit(f"::error::BinaryPrediction(1) gave {v}, expected 0.999")

          # Anything above 1 must still raise. That is what makes a percentage
          # mis-parse fail as a SAMPLE rather than publish a wrong number.
          # try/except/else, not a nested catch: an earlier version of this step
          # wrote `except sys.exit.__class__`, which is not an exception class at
          # all, and the job died on a TypeError instead of checking anything.
          try:
              BinaryPrediction(prediction_in_decimal=73)
          except Exception:
              pass
          else:
              sys.exit("::error::BinaryPrediction(73) did not raise - a percentage mis-parse would now publish")

          # The option guard reads exactly these two attribute names.
          try:
              ol = PredictedOptionList(predicted_options=[
                  {"option_name": "A", "probability": 0.5},
                  {"option_name": "B", "probability": 0.5},
              ])
              names = {o.option_name for o in ol.predicted_options}
          except Exception as exc:
              sys.exit(f"::error::PredictedOptionList shape changed, the option guard reads it: {exc}")
          if names != {"A", "B"}:
              sys.exit(f"::error::PredictedOptionList returned {names}, expected A and B")

          print("library behaviours unchanged")
          EOF
