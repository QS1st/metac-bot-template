name: Forecast on new AI tournament questions

on:
  workflow_dispatch:
  schedule:
    # Every 10 minutes, offset off the hour. Questions open at random hours for
    # only 1.5h (temporarily 3h). GitHub cron is imprecise and drops runs under
    # load; the top open-source bot attributes ~150 forfeited peer points to
    # questions missed this way. Cadence is the cheapest mitigation available.
    # Deliberately ONE workflow: two overlapping schedules could each see a
    # question as unforecast and submit twice, breaching one-forecast-per-question.
    # The concurrency group below prevents overlapping runs.
    - cron: "3,13,23,33,43,53 * * * *"

# Add concurrency group to prevent parallel runs
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false


# Daily job to run the simple forecast bot
jobs:
  forecast_job:
    runs-on: ubuntu-latest # determines the machine that will run the job - keep as is
    # A hung run would otherwise hold the concurrency group for GitHub's 6-hour
    # default, blocking every subsequent run and silently costing us a whole
    # afternoon of questions.
    #
    # 40 from 22 Sept 2026, was 30. Pacing at 8 calls/minute with no burst
    # means ~7.5s between default-model calls, so five predictions is ~37s a
    # question. Questions are gathered concurrently and finish near the end, so
    # a timeout kill loses most of the batch rather than a tail of it. Late
    # still scores; killed does not.
    #
    # WHY IT WENT UP. Subquestion research adds a generation call plus two
    # research calls to half the questions, serially, inside the three-slot
    # limiter. Audited arithmetic for a 40-question batch: the research stage
    # goes from ~3.3 to ~7 minutes and the run from ~28 to ~32, which would
    # have sat the other side of a 30-minute kill. Ten minutes of headroom
    # costs nothing on a run that finishes early and buys the whole batch on
    # one that does not.
    #
    # The cost is that a long run holds the concurrency group for longer
    # against a 10-minute cron. Questions stay open 1.5-3 hours, so even a
    # full-length run leaves two to four attempts at every question.
    timeout-minutes: 40
    steps: # sets up the steps that will be run in order
      # setup repository with all necessary dependencies - keep as is
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Pinned 25 Sept 2026 to what the live runs already use (run 1834's log:
      # this action SHA, Poetry 2.5.1), so the happy path is unchanged:
      #   * the action by commit, not the floating @v1 tag;
      #   * Poetry 2.5.1, not "latest" (2.5.0 shipped 19 Sept, 2.5.1 on the
      #     20th; a new Poetry release can no longer land mid-season unseen).
      # NOT a full freeze: the installer still takes the newest pip and the
      # newest of Poetry's own dependencies, and checkout/setup-python float.
      # poetry.lock was generated by 2.4.1 (lock-version 2.1); 2.5.1 is what
      # every live run has installed since PyPI made it "latest" on 20 Sept.
      # Move all five workflows together, and only between seasons.
      - name: Install poetry
        id: poetry_first
        continue-on-error: true
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1, pinned
        with:
          version: "2.5.1"
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      # ONE RETRY, added 25 Sept 2026. Both failures in this workflow's life
      # (run 1105 on 16 Sept, run 1815 on 25 Sept) died in this step, before
      # any of our code ran — and both cleared on the next cron tick. A missed tick costs little (questions stay open 1.5-3h), but
      # it sends a failure email that looks like a bot fault. The installer
      # removes its partial environment on failure, so a second attempt starts
      # clean. If the retry also fails the job fails exactly as before.
      - name: Wait before retrying the Poetry install
        if: steps.poetry_first.outcome == 'failure'
        run: sleep 30
      - name: Install poetry (retry)
        id: poetry_retry
        if: steps.poetry_first.outcome == 'failure'
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1, pinned
        with:
          version: "2.5.1"
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      # Adding the below will make the workflow faster, but will mean you don't automatically get updates from forecasting-tools and other packages
      # - name: Load cached venv
      #   id: cached-poetry-dependencies
      #   uses: actions/cache@v4
      #   with:
      #     path: .venv
      #     key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Run bot
        run: |
          poetry run python main.py
        # this reads the environment variables from the github repository.
        # Store under Settings --> Secrets and variables --> Actions
        env:
          # Repository VARIABLES (not secrets), and not visible to the process
          # unless passed through here — an unset variable renders as an empty
          # string. There is no fallback to the SDK constant, which is pinned to
          # Summer 2026 and would have forecast a finished tournament.
          #
          #   AIB_TOURNAMENT_ID  REQUIRED in tournament mode. Three states:
          #                        <id or slug>  forecast that season.
          #                                      Fall 2026 = 33121
          #                                      (fall-futureeval-2026), opens
          #                                      28 Sept 2026.
          #                        none          NO season right now, declared
          #                                      deliberately. MiniBench only,
          #                                      run stays green. EXPIRES on
          #                                      30 Sept 2026, after which it
          #                                      reds — because every seasonal
          #                                      detector sits behind it, and a
          #                                      forgotten "none" would forfeit
          #                                      a whole season while looking
          #                                      perfectly healthy.
          #                        unset/blank   run goes red. MiniBench is
          #                                      still forecast first.
          #                      NOTE the two days of grace past the 28th are
          #                      deliberate: Metaculus creates a tournament
          #                      project before populating it, and an empty
          #                      seasonal tournament is fatal by design. Do not
          #                      set the real ID until Fall HAS questions.
          #
          #   MODEL_TIER         free | test | trial | season, so the tier can
          #                      change without a commit and a CI cycle. A
          #                      scored tournament REFUSES to run on free or
          #                      test — see assert_tier_matches_mode.
          AIB_TOURNAMENT_ID: ${{ vars.AIB_TOURNAMENT_ID }}
          MODEL_TIER: ${{ vars.MODEL_TIER }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }} # replace this with the name of the variable under which you stored your own Metaculus token
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}

      # main.py writes its own verdict to the run page, but only if it reaches
      # the end. A crash — a bad MODEL_TIER, an API error, a dependency
      # failure — dies before that and leaves the run page blank, so the only
      # way to find out what happened is to scroll two thousand log lines.
      # Audit, 6 Sept 2026. This step runs ONLY on failure and only if nothing
      # was written, so it can never talk over a real summary.
      - name: Explain an unexplained failure
        if: failure()
        run: |
          if [ ! -s "$GITHUB_STEP_SUMMARY" ] && [ "${{ steps.poetry_retry.outcome }}" = "failure" ]; then
            echo "## SETUP FAILED: Poetry would not install, twice" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The bot never started, so nothing was forecast and nothing was spent. Most likely a GitHub or PyPI blip rather than our code. If the next scheduled run is green, no action is needed. If every run fails here, a Poetry dependency has probably broken the install." >> "$GITHUB_STEP_SUMMARY"
          elif [ ! -s "$GITHUB_STEP_SUMMARY" ]; then
            echo "## CRASHED before writing a summary" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The bot died before it could report. Common causes, in order of likelihood:" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- \`MODEL_TIER\` is unset or not one of free/test/trial/season. A scored tournament refuses to run on \`test\`." >> "$GITHUB_STEP_SUMMARY"
            echo "- A required secret is missing (\`METACULUS_TOKEN\`, \`OPENROUTER_API_KEY\`)." >> "$GITHUB_STEP_SUMMARY"
            echo "- The Metaculus API returned an error while fetching questions." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Open the **Run bot** step and read the last twenty lines." >> "$GITHUB_STEP_SUMMARY"
          fi