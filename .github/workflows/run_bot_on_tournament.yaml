name: Forecast on new AI tournament questions

on:
  workflow_dispatch:
  schedule:
    # Every 10 minutes, offset off the hour. Questions open at random hours for
    # only 1.5h (temporarily 3h). GitHub cron is imprecise and drops runs under
    # load; the top open-source bot attributes ~150 forfeited peer points to
    # questions missed this way. Cadence is the cheapest mitigation available.
    # Deliberately ONE workflow: two overlapping schedules could each see a
    # question as unforecast and submit twice, breaching one-forecast-per-question.
    # The concurrency group below prevents overlapping runs.
    - cron: "3,13,23,33,43,53 * * * *"

# Add concurrency group to prevent parallel runs
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false


# Daily job to run the simple forecast bot
jobs:
  forecast_job:
    runs-on: ubuntu-latest # determines the machine that will run the job - keep as is
    # A hung run would otherwise hold the concurrency group for GitHub's 6-hour
    # default, blocking every subsequent run and silently costing us a whole
    # afternoon of questions. A healthy full pass takes ~3 minutes.
    timeout-minutes: 20
    steps: # sets up the steps that will be run in order
      # setup repository with all necessary dependencies - keep as is
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      # Adding the below will make the workflow faster, but will mean you don't automatically get updates from forecasting-tools and other packages
      # - name: Load cached venv
      #   id: cached-poetry-dependencies
      #   uses: actions/cache@v4
      #   with:
      #     path: .venv
      #     key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Run bot
        run: |
          poetry run python main.py
        # this reads the environment variables from the github repository.
        # Store under Settings --> Secrets and variables --> Actions
        env:
          # Repository VARIABLES (not secrets), and not visible to the process
          # unless passed through here — an unset variable renders as an empty
          # string. AIB_TOURNAMENT_ID is REQUIRED in tournament mode: unset, the
          # bot forecasts MiniBench, skips the seasonal half and fails the run.
          # There is no longer a fallback to the SDK constant, which was pinned
          # to Summer 2026 and would have forecast a finished tournament.
          #   AIB_TOURNAMENT_ID  the seasonal tournament, for the September
          #                      rollover the pinned SDK cannot do for us.
          #   MODEL_TIER         free | test | season, so the tier can change
          #                      without a commit and a CI cycle.
          AIB_TOURNAMENT_ID: ${{ vars.AIB_TOURNAMENT_ID }}
          MODEL_TIER: ${{ vars.MODEL_TIER }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }} # replace this with the name of the variable under which you stored your own Metaculus token
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}